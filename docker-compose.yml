version: '3.8'

services:
  # Servicio Web (PHP 8.2 + Apache)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveyd_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app_encuestas
      DB_USER: omnipoll_user
      DB_PASS: secret_prod_pass
    depends_on:
      db:
        condition: service_healthy

  # Servicio de Base de Datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: surveyd_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_prod_pass
      MYSQL_DATABASE: app_encuestas
      MYSQL_USER: omnipoll_user
      MYSQL_PASSWORD: secret_prod_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_prod_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
